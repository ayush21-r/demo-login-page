name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "ci/**"

permissions:
  contents: write

jobs:
  test:
    name: Validate static site
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JavaScript
        run: node --check script.js

      - name: Validate credentials JSON
        run: node -e "JSON.parse(require('fs').readFileSync('credentials.json', 'utf8'))"

      - name: Check page response
        run: |
          python3 -m http.server 8000 > /tmp/hack-with-india-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail http://127.0.0.1:8000/; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/hack-with-india-server.log
          exit 1

  deploy:
    name: Publish site
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .
          exclude_assets: .github
